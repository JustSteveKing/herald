name: PayPal
homepage: https://www.paypal.com
docs: https://developer.paypal.com/api/rest/webhooks/rest/#link-messagesignatureverification

notes: |
  PayPal signatures cannot be faked, and this pack does not pretend otherwise.

  PayPal signs with RSA rather than an HMAC. The receiving application is told
  to download PayPal's certificate from the URL in the paypal-cert-url header,
  check that URL is on a paypal.com domain, and verify the signature against
  the public key in that certificate. There is no shared secret to hold, so
  nothing herald can hold either. Producing a delivery that verifies would mean
  serving a fake certificate from a domain you do not own.

  So this pack sends the payload with realistic headers and no valid signature.
  It is useful for the half of the handler that parses the event, routes on
  event_type and updates your own records. It is no use at all for testing the
  verification step, and a handler that accepts this delivery is telling you it
  never verifies anything.

  Two ways to cover the rest. PayPal's own webhooks simulator in the developer
  dashboard sends genuine signed deliveries to a public URL. Or verify against
  the verify-webhook-signature API endpoint, which needs the real event.

secret:
  label: Not used, PayPal signs with RSA

transport:
  method: POST
  contentType: application/json
  headers:
    User-Agent: PayPal/AUHD-214.0-59484925
    correlation-id: c6b1a2d34e5f6
    paypal-auth-algo: SHA256withRSA
    paypal-cert-url: https://api.sandbox.paypal.com/v1/notifications/certs/CERT-360caa42-fca2a594-1d93a270
    paypal-transmission-id: "{id}"
    paypal-transmission-time: "{timestamp}"

timestamp:
  format: rfc3339

signing: []

events:
  PAYMENT.CAPTURE.COMPLETED:
    description: A payment capture completed.
    notes: Unsigned. See the provider notes before trusting a pass.
