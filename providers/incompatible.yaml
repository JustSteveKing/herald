# Providers herald deliberately does not ship, and why.
#
# The rule is one line: if verifying a delivery means fetching a public key or
# a certificate from a domain the provider controls, herald cannot produce a
# delivery that verifies, and neither can anything else that is not them.
# There is no shared secret to hold. Faking one would mean serving a forged
# certificate from a domain you do not own.
#
# A pack that sends the payload with no valid signature is worse than no pack.
# It passes against a handler that never verifies anything, which is exactly
# the handler you most want to catch, and it reports that as a green result.
#
# This is not the same as a provider that does not sign at all. Mollie's
# classic webhook has no signature by design, so herald reproduces it exactly
# and ships it. Absent by design is reproducible; absent because you cannot
# forge it is not.

incompatible:
  - id: paypal
    name: PayPal
    docs: https://developer.paypal.com/api/rest/webhooks/rest/#link-messagesignatureverification
    scheme: RSA, with a certificate fetched from a paypal.com URL
    summary: PayPal signs with RSA and your handler downloads the certificate from a URL it checks is on paypal.com.
    detail: |
      The delivery carries paypal-transmission-sig, paypal-cert-url and
      paypal-auth-algo. Verification downloads the certificate named by that
      URL, having first checked the URL is a paypal.com domain, and verifies
      the signature against the public key in it. Nothing in that chain
      involves a secret you hold.
    workaround: |
      Use PayPal's own webhooks simulator in the developer dashboard, which
      sends genuinely signed deliveries to a public URL, or call their
      verify-webhook-signature endpoint with a real captured event.

  - id: aws-sns
    name: Amazon SNS
    docs: https://docs.aws.amazon.com/sns/latest/dg/sns-verify-signature-of-message.html
    scheme: RSA, with a certificate fetched from an amazonaws.com URL
    summary: SNS signs with a certificate your handler fetches over HTTPS from the SigningCertURL in the message.
    detail: |
      The message carries Signature, SignatureVersion and SigningCertURL.
      AWS tells you to fetch that certificate over HTTPS, confirm it was
      issued by Amazon SNS and that its chain of trust is valid, then verify.
      There is no shared secret at any point.
    workaround: |
      Publish a real message to a test topic pointed at your endpoint. SNS
      delivers to any HTTPS URL you have confirmed the subscription on, so a
      tunnel to localhost is enough.

  - id: apple-app-store
    name: Apple App Store Server Notifications V2
    docs: https://developer.apple.com/documentation/appstoreservernotifications/responsebodyv2
    scheme: JWS with an x5c certificate chain, verified to an Apple root
    summary: The whole payload is a JWS whose header carries a three-certificate chain that has to verify up to an Apple root.
    detail: |
      There is no separate signature header, because the notification itself
      is a signed JWT. Apple's own verification library reads the x5c header,
      requires a chain of exactly three certificates, and verifies the leaf
      against Apple's root certificates before trusting the payload. Signing
      one means holding Apple's private key.
    workaround: |
      Use the Request a Test Notification endpoint in the App Store Server
      API, which makes Apple send a real, signed notification to the URL you
      have configured.

  - id: google-pubsub
    name: Google Cloud Pub/Sub push
    docs: https://docs.cloud.google.com/pubsub/docs/authenticate-push-subscriptions
    scheme: OIDC JWT signed by Google, verified against Google's public keys
    summary: Push subscriptions authenticate with an OIDC bearer token signed by Google, and there is no shared-secret option.
    detail: |
      The Authorization header carries a JWT signed by the Pub/Sub service.
      Your handler verifies it against Google's public certificates and
      checks the email and audience claims. Google documents no shared
      secret and no token parameter as an alternative, so the only way to
      produce an acceptable token is to be Google.
    workaround: |
      Publish to the topic from the emulator or a test project. Anything
      reaching your endpoint that is not from Google is supposed to fail,
      which is the behaviour you are testing.
