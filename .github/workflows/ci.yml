name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./...

  # Every pack is a claim about how somebody else signs their webhooks, and a
  # wrong one produces a signature that fails in a way the person will debug in
  # their own code first. The vectors are regenerated by a second
  # implementation of the rules, so a pack change that the Go engine reads
  # differently shows up here rather than in someone's afternoon.
  packs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - run: pip install pyyaml

      - name: Regenerate the signature vectors
        run: python3 scripts/gen_vectors.py > signer/vectors_test.go

      - name: The committed vectors must match the packs
        run: |
          if ! git diff --quiet signer/vectors_test.go; then
            echo "The packs and the committed vectors disagree."
            echo "Run: python3 scripts/gen_vectors.py > signer/vectors_test.go"
            git diff signer/vectors_test.go
            exit 1
          fi

      - name: Test against them
        run: go test ./pack/ ./signer/
